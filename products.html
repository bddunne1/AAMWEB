<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | Aamstrand Ropes &amp; Twines</title>
  <meta name="description" content="Browse Aamstrand braided rope, twisted rope, twine and specialty cordage by construction, material and industry.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="products">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-head"><div class="wrap">
      <span class="eyebrow" style="color:var(--hemp)">Product catalog</span>
      <h1>Rope, cord &amp; twine</h1>
      <p class="lead">Filter by construction, fiber or industry. Every line is available in custom lengths, colors and put-ups.</p>
    </div></section>

    <div class="catalog-bar"><div class="wrap">
      <div class="tabs" id="cat-tabs" role="tablist" aria-label="Product category"></div>
      <div class="filters">
        <input type="search" id="search" placeholder="Search products, e.g. halyard, baler, manila" aria-label="Search products">
        <select id="mat-filter" aria-label="Material"></select>
        <select id="use-filter" aria-label="Industry"></select>
        <span id="result-count" aria-live="polite"></span>
      </div>
    </div></div>

    <section class="wrap" style="padding-bottom:96px">
      <p class="muted" id="cat-blurb"></p>
      <div class="product-grid" id="catalog-grid"></div>
    </section>

    <section class="cta-band"><div class="wrap">
      <div><h2>Don't see what you need?</h2><p>Custom constructions, colors and put-ups are part of what we do.</p></div>
      <a class="btn btn-white" href="contact.html?product=custom#quote">Ask about a custom build</a>
    </div></section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
